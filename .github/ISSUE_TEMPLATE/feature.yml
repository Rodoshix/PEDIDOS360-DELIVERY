name: Nueva funcionalidad
description: Registrar una funcionalidad concreta y verificable
title: "[FEATURE] "
labels: ["feature"]
body:
  - type: textarea
    id: objective
    attributes:
      label: Objetivo
      description: Describe el resultado esperado en una oración.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Criterios de aceptación
      description: Lista las condiciones que permiten considerar terminada la tarea.
      placeholder: |
        - [ ] Condición 1
        - [ ] Condición 2
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencias o contrato
      description: Indica qué componente, DTO o endpoint necesita esta tarea.
  - type: input
    id: owner
    attributes:
      label: Responsable
      placeholder: Integrante 1, 2, 3 o 4
    validations:
      required: true
