spring:
  application:
    name: restaurantes-service

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5438/pedidos360_restaurantes}
    username: ${DB_USERNAME:pedidos360}
    password: ${DB_PASSWORD:replace-me}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_schema: restaurantes
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: restaurantes
    schemas: restaurantes
    create-schemas: true
    clean-disabled: true

server:
  port: 8082
  address: 127.0.0.1

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always