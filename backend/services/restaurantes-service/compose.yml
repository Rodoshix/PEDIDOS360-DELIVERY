services:
  postgres:
    image: postgres:17-alpine
    container_name: pedidos360-restaurantes-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME:-pedidos360_restaurantes}
      POSTGRES_USER: ${DB_USERNAME:-pedidos360}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-replace-me}

    ports:
      - "${DB_PORT:-5438}:5432"

    volumes:
      - restaurantes_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME:-pedidos360} -d ${DB_NAME:-pedidos360_restaurantes}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  restaurantes_postgres_data: