spring:
  config:
    import: optional:file:.env.local[.properties]
  application:
    name: usuarios-service
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/pedidos360_usuarios}
    username: ${DB_USERNAME:pedidos360_usuarios}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: usuarios
        jdbc:
          time_zone: UTC
  flyway:
    default-schema: usuarios
    schemas: usuarios
    clean-disabled: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:pedidos360}
    dynamic: false
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

server:
  port: ${SERVER_PORT:8081}
  address: ${SERVER_ADDRESS:127.0.0.1}

usuarios:
  identidad-local:
    enabled: ${LOCAL_IDENTITY_ENABLED:false}
    tenant-id: ${LOCAL_TENANT_ID:}
    object-id: ${LOCAL_OBJECT_ID:}
    roles: ${LOCAL_ROLES:CLIENTE}

entra:
  enabled: ${ENTRA_ENABLED:false}
  tenant-id: ${ENTRA_TENANT_ID:}
  api-client-id: ${ENTRA_API_CLIENT_ID:}
  frontend-client-id: ${ENTRA_FRONTEND_CLIENT_ID:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

  health:
    rabbit:
      enabled: false # HTTP sigue oficial con el relay desactivado.

pedidos360:
  messaging:
    relay-mode: ${PEDIDOS360_RELAY_MODE:DISABLED}
    role: SERVICE
    declare-topology: false # Provisioning/policies corresponden a #69, sin configure.
    exchanges:
      queries: p360.queries
      retry: p360.retry
      dlx: p360.dlx
    queues:
      responses: p360.bff.consultas.respuestas.q
    naming:
      prefix: p360.
      query-suffix: .consultas.q
      retry-suffix: .consultas.retry.1s.q
      dlq-suffix: .consultas.dlq
      retry-key-suffix: .retry.1s
      failed-key-suffix: .failed
    routing:
      usuario: usuario.consultar-actual.v1
      restaurante: restaurante.listar.v1
      producto: producto.listar-disponibles.v1
      pago: pago.consultar.v1
      usuario-base: usuario.consultar-actual
      restaurante-base: restaurante.listar
      producto-base: producto.listar-disponibles
      pago-base: pago.consultar
    deadline: ${PEDIDOS360_QUERY_DEADLINE:5s}
    actor-ttl: ${PEDIDOS360_ACTOR_TTL:4s}
    retry-delay: ${PEDIDOS360_RETRY_DELAY:1s}
    confirm-timeout: ${PEDIDOS360_CONFIRM_TIMEOUT:3s}
    recovery-backoff: ${PEDIDOS360_RECOVERY_BACKOFF:500ms}
    max-pending-correlations: 1024
    max-body-bytes: 262144
    # Preparación de PR2: habilitación coordinada; HTTP permanece oficial.
    identity-proof:
      enabled: ${PEDIDOS360_IDENTITY_PROOF_ENABLED:false}
      public-jwks: ${PEDIDOS360_IDENTITY_PROOF_PUBLIC_JWKS:}
      clock-margin: ${PEDIDOS360_IDENTITY_PROOF_CLOCK_MARGIN:250ms}
      key-id: ${USUARIOS_IDENTITY_PROOF_KEY_ID:}
      private-jwk: ${USUARIOS_IDENTITY_PROOF_PRIVATE_JWK:}
    actor:
      emisor: ${ENTRA_TENANT_ID:}
      public-jwks: ${PEDIDOS360_ACTOR_PUBLIC_JWKS:}
      tolerancia-reloj: ${PEDIDOS360_ACTOR_CLOCK_SKEW:5s}
