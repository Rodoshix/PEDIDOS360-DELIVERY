spring:
  config:
    import: optional:file:.env.local[.properties]
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    virtual-host: ${RABBITMQ_VHOST:pedidos360}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    connection-timeout: 3s
    template:
      mandatory: true
  application:
    name: pedidos-service
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5436/pedidos360_pedidos}
    username: ${DB_USERNAME:pedidos360_pedidos}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: pedidos
        jdbc:
          time_zone: UTC
  flyway:
    default-schema: pedidos
    schemas: pedidos
    clean-disabled: true

server:
  port: ${SERVER_PORT:8085}
  address: ${SERVER_ADDRESS:127.0.0.1}

pedidos:
  productos-url: ${PRODUCTOS_SERVICE_URL:http://localhost:8083}
  identidad-local:
    enabled: ${LOCAL_IDENTITY_ENABLED:false}
    usuario-id: ${LOCAL_USER_ID:}
    roles: ${LOCAL_ROLES:CLIENTE}
  # Endpoint interno de confirmación de pago (worker de Pagos). Deshabilitado por defecto:
  # se habilita cuando exista el worker en Entra. Valores públicos, no credenciales.
  interno:
    enabled: ${INTERNO_ENABLED:false}
    tenant-id: ${ENTRA_TENANT_ID:}
    audience: ${ENTRA_API_CLIENT_ID:}
    worker-client-id: ${PAGOS_WORKER_CLIENT_ID:}
    rol-requerido: ${INTERNO_ROL:Pedidos.Confirmar}

management:
  health:
    rabbit:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
entra:
  enabled: ${ENTRA_ENABLED:false}
  tenant-id: ${ENTRA_TENANT_ID:}
  api-client-id: ${ENTRA_API_CLIENT_ID:}
  frontend-client-id: ${ENTRA_FRONTEND_CLIENT_ID:}
  usuarios-url: ${USUARIOS_SERVICE_URL:http://localhost:8081}

pedidos360:
  messaging:
    coordination-mode: ${PEDIDOS360_COORDINATION_MODE:HTTP}
    exchanges:
      commands: p360.pedidos.commands
    routing-keys:
      confirmar: pedido.confirmar.v1
    queues:
      confirmacion: p360.pedidos.confirmacion.q
    confirm-timeout: 3s
    lease: 30s
    batch-size: 10
    dispatch-interval-ms: 5000
    publisher-retry-delay: 30s
    reliability:
      platform-ready: ${PEDIDOS360_RELIABILITY_PLATFORM_READY:false}
      retry-exchange: p360.pedidos.retry
      dlx: p360.pedidos.dlx
      dlq: p360.pedidos.confirmacion.dlq
      failed-routing-key: pedido.confirmar.failed
      retry5-queue: p360.pedidos.confirmacion.retry.5s.q
      retry30-queue: p360.pedidos.confirmacion.retry.30s.q
      retry120-queue: p360.pedidos.confirmacion.retry.120s.q
      retry5-key: pedido.confirmar.retry.5s
      retry30-key: pedido.confirmar.retry.30s
      retry120-key: pedido.confirmar.retry.120s
      recovery-backoff: 5s
