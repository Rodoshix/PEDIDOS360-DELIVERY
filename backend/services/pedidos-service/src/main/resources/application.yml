spring:
  config:
    import: optional:file:.env.local[.properties]
  application:
    name: pedidos-service
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/pedidos360_pedidos}
    username: ${DB_USERNAME:pedidos360_pedidos}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: pedidos
        jdbc:
          time_zone: UTC
  flyway:
    default-schema: pedidos
    schemas: pedidos
    clean-disabled: true

server:
  port: ${SERVER_PORT:8085}
  address: ${SERVER_ADDRESS:127.0.0.1}

pedidos:
  identidad-local:
    enabled: ${LOCAL_IDENTITY_ENABLED:false}
    usuario-id: ${LOCAL_USER_ID:}
    roles: ${LOCAL_ROLES:CLIENTE}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
