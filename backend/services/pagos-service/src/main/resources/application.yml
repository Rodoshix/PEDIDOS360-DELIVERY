spring:
  config:
    import: optional:file:.env.local[.properties]
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    virtual-host: ${RABBITMQ_VHOST:pedidos360}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    connection-timeout: 3s
    template:
      mandatory: true
  application:
    name: pagos-service
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5437/pedidos360_pagos}
    username: ${DB_USERNAME:pedidos360_pagos}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: pagos
        jdbc:
          time_zone: UTC
  flyway:
    default-schema: pagos
    schemas: pagos
    clean-disabled: true

server:
  port: ${SERVER_PORT:8086}
  address: ${SERVER_ADDRESS:127.0.0.1}

pagos:
  consultas:
    rabbitmq:
      host: ${PAGOS_QUERY_RABBITMQ_HOST:localhost}
      port: ${PAGOS_QUERY_RABBITMQ_PORT:5672}
      virtual-host: ${PAGOS_QUERY_RABBITMQ_VHOST:pedidos360}
      username: ${PAGOS_QUERY_RABBITMQ_USERNAME:}
      password: ${PAGOS_QUERY_RABBITMQ_PASSWORD:}
      connection-timeout: 3s
  worker:
    enabled: ${PAGOS_WORKER_ENABLED:false}
    tenant-id: ${ENTRA_TENANT_ID:}
    api-client-id: ${ENTRA_API_CLIENT_ID:}
    client-id: ${PAGOS_WORKER_CLIENT_ID:}
    client-secret: ${PAGOS_WORKER_CLIENT_SECRET:}
  identidad-local:
    tenant-id: ${LOCAL_TENANT_ID:}
    enabled: ${LOCAL_IDENTITY_ENABLED:false}
    usuario-id: ${LOCAL_USER_ID:}
    roles: ${LOCAL_ROLES:CLIENTE}
  pedidos:
    base-url: ${PEDIDOS_SERVICE_URL:http://localhost:8085}
    # Confirmación vía endpoint interno con token de aplicación (requiere el worker en Entra).
    interno-habilitado: ${PEDIDOS_INTERNO_ENABLED:false}
  reconciliacion:
    enabled: ${RECONCILIACION_ENABLED:true}
    intervalo-ms: ${RECONCILIACION_INTERVALO_MS:30000}

management:
  health:
    rabbit:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
entra:
  enabled: ${ENTRA_ENABLED:false}
  tenant-id: ${ENTRA_TENANT_ID:}
  api-client-id: ${ENTRA_API_CLIENT_ID:}
  frontend-client-id: ${ENTRA_FRONTEND_CLIENT_ID:}
  usuarios-url: ${USUARIOS_SERVICE_URL:http://localhost:8081}

pedidos360:
  messaging:
    relay-mode: ${PEDIDOS360_RELAY_MODE:DISABLED}
    role: SERVICE
    declare-topology: false
    coordination-mode: ${PEDIDOS360_COORDINATION_MODE:HTTP}
    exchanges:
      commands: p360.pedidos.commands
      queries: p360.queries
      retry: p360.retry
      dlx: p360.dlx
    routing-keys:
      confirmar: pedido.confirmar.v1
    queues:
      confirmacion: p360.pedidos.confirmacion.q
      responses: p360.bff.consultas.respuestas.q
    confirm-timeout: 3s
    lease: 30s
    batch-size: 10
    dispatch-interval-ms: 5000
    publisher-retry-delay: 30s
    naming:
      prefix: p360.
      query-suffix: .consultas.q
      retry-suffix: .consultas.retry.1s.q
      dlq-suffix: .consultas.dlq
      retry-key-suffix: .retry.1s
      failed-key-suffix: .failed
    routing:
      usuario: usuario.consultar-actual.v1
      restaurante: restaurante.listar.v1
      producto: producto.listar-disponibles.v1
      pago: pago.consultar.v1
      usuario-base: usuario.consultar-actual
      restaurante-base: restaurante.listar
      producto-base: producto.listar-disponibles
      pago-base: pago.consultar
    deadline: 5s
    actor-ttl: 4s
    retry-delay: 1s
    recovery-backoff: 500ms
    max-pending-correlations: 1024
    max-body-bytes: 262144
    actor:
      emisor: ${ENTRA_TENANT_ID:}
      public-jwks: ${PEDIDOS360_ACTOR_PUBLIC_JWKS:}
      tolerancia-reloj: ${PEDIDOS360_ACTOR_CLOCK_SKEW:5s}
    identity-proof:
      enabled: ${PEDIDOS360_IDENTITY_PROOF_ENABLED:false}
      public-jwks: ${USUARIOS_IDENTITY_PROOF_PUBLIC_JWKS:}
      clock-margin: 250ms
