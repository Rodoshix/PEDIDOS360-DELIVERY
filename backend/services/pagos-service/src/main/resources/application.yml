spring:
  config:
    import: optional:file:.env.local[.properties]
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    virtual-host: ${RABBITMQ_VHOST:pedidos360}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    connection-timeout: 3s
    template:
      mandatory: true
  application:
    name: pagos-service
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5437/pedidos360_pagos}
    username: ${DB_USERNAME:pedidos360_pagos}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: pagos
        jdbc:
          time_zone: UTC
  flyway:
    default-schema: pagos
    schemas: pagos
    clean-disabled: true

server:
  port: ${SERVER_PORT:8086}
  address: ${SERVER_ADDRESS:127.0.0.1}

pagos:
  worker:
    enabled: ${PAGOS_WORKER_ENABLED:false}
    tenant-id: ${ENTRA_TENANT_ID:}
    api-client-id: ${ENTRA_API_CLIENT_ID:}
    client-id: ${PAGOS_WORKER_CLIENT_ID:}
    client-secret: ${PAGOS_WORKER_CLIENT_SECRET:}
  identidad-local:
    enabled: ${LOCAL_IDENTITY_ENABLED:false}
    usuario-id: ${LOCAL_USER_ID:}
    roles: ${LOCAL_ROLES:CLIENTE}
  pedidos:
    base-url: ${PEDIDOS_SERVICE_URL:http://localhost:8085}
    # Confirmación vía endpoint interno con token de aplicación (requiere el worker en Entra).
    interno-habilitado: ${PEDIDOS_INTERNO_ENABLED:false}
  reconciliacion:
    enabled: ${RECONCILIACION_ENABLED:true}
    intervalo-ms: ${RECONCILIACION_INTERVALO_MS:30000}

management:
  health:
    rabbit:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
entra:
  enabled: ${ENTRA_ENABLED:false}
  tenant-id: ${ENTRA_TENANT_ID:}
  api-client-id: ${ENTRA_API_CLIENT_ID:}
  frontend-client-id: ${ENTRA_FRONTEND_CLIENT_ID:}
  usuarios-url: ${USUARIOS_SERVICE_URL:http://localhost:8081}

pedidos360:
  messaging:
    coordination-mode: ${PEDIDOS360_COORDINATION_MODE:HTTP}
    exchanges:
      commands: p360.pedidos.commands
    routing-keys:
      confirmar: pedido.confirmar.v1
    queues:
      confirmacion: p360.pedidos.confirmacion.q
    confirm-timeout: 3s
    lease: 30s
    batch-size: 10
    dispatch-interval-ms: 5000
    publisher-retry-delay: 30s
