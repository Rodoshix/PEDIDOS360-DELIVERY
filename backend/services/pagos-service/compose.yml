name: pedidos360-pagos-local

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-pedidos360_pagos}
      POSTGRES_USER: ${DB_USERNAME:-pedidos360_pagos}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en .env.local}
    ports:
      - "127.0.0.1:${DB_PORT:-5437}:5432"
    volumes:
      - pagos_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pagos_pg_data:
