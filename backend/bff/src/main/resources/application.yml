spring:
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  application:
    name: pedidos360-bff
  config:
    import: optional:file:.env.local[.properties]
  rabbitmq:
    # El BFF solo usa el broker para consultas internas; con relay-mode DISABLED no se conecta.
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    virtual-host: ${RABBITMQ_VHOST:pedidos360}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    connection-timeout: 3s
    template:
      mandatory: true
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
entra:
  enabled: ${ENTRA_ENABLED:false}
  tenant-id: ${ENTRA_TENANT_ID:}
  api-client-id: ${ENTRA_API_CLIENT_ID:}
  frontend-client-id: ${ENTRA_FRONTEND_CLIENT_ID:}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    rabbit:
      # Se preserva /actuator/health sin exigir broker mientras HTTP es el transporte predeterminado.
      enabled: false
bff:
  pedidos-pagos-enabled: ${BFF_PEDIDOS_PAGOS_ENABLED:false}
  pedidos-url: ${PEDIDOS_SERVICE_URL:http://127.0.0.1:8085}
  pagos-url: ${PAGOS_SERVICE_URL:http://127.0.0.1:8086}
  restaurantes-url: ${RESTAURANTES_SERVICE_URL:http://127.0.0.1:8082}
  productos-url: ${PRODUCTOS_SERVICE_URL:http://127.0.0.1:8083}
  carrito-url: ${CARRITO_SERVICE_URL:http://127.0.0.1:8084}
  usuarios-url: ${USUARIOS_SERVICE_URL:http://127.0.0.1:8081}
  cors-origins: ${BFF_CORS_ORIGINS:http://localhost:5173,http://localhost:5180}
  upstream-timeout-ms: ${BFF_UPSTREAM_TIMEOUT_MS:5000}

pedidos360:
  messaging:
    # HTTP sigue siendo el transporte predeterminado. ACTIVE solo habilita el adaptador interno.
    relay-mode: ${PEDIDOS360_RELAY_MODE:DISABLED}
    # El BFF es solicitante: mantiene correlaciones y consume la cola tecnica de respuestas.
    role: ${PEDIDOS360_RELAY_ROLE:BFF}
    # Herramienta de desarrollo: con la plataforma de #69 las colas ya existen y su TTL/DLX vive en
    # policies. La declaracion no incluye argumentos inmutables, por lo que es compatible al redeclarar.
    declare-topology: ${PEDIDOS360_DECLARE_TOPOLOGY:false}
    exchanges:
      queries: p360.queries
      retry: p360.retry
      dlx: p360.dlx
    queues:
      responses: p360.bff.consultas.respuestas.q
    naming:
      prefix: p360.
      query-suffix: .consultas.q
      retry-suffix: .consultas.retry.1s.q
      dlq-suffix: .consultas.dlq
      # La routing key de retry deriva de la principal: usuario.consultar-actual.v1 -> usuario.consultar-actual.retry.1s
      retry-key-suffix: ${PEDIDOS360_RETRY_KEY_SUFFIX:.retry.1s}
      failed-key-suffix: .failed
    routing:
      usuario: usuario.consultar-actual.v1
      restaurante: restaurante.listar.v1
      producto: producto.listar-disponibles.v1
      pago: pago.consultar.v1
      # Sufijo base para derivar las routing keys de retry y failed del inventario aprobado.
      usuario-base: usuario.consultar-actual
      restaurante-base: restaurante.listar
      producto-base: producto.listar-disponibles
      pago-base: pago.consultar
    # Presupuesto inicial aprobado de 5 s. Un retry no renueva este plazo.
    deadline: ${PEDIDOS360_QUERY_DEADLINE:5s}
    # El sobre del actor debe vencer antes que el request para que el retry conserve autorizacion.
    actor-ttl: ${PEDIDOS360_ACTOR_TTL:4s}
    # Retry corto unico. No son las etapas 5/30/120 de Pedidos.
    retry-delay: ${PEDIDOS360_RETRY_DELAY:1s}
    confirm-timeout: ${PEDIDOS360_CONFIRM_TIMEOUT:3s}
    # Backoff entre la detencion y el reinicio del listener cuando un handoff no se confirma.
    # Reemplaza a la antigua espera bloqueante entre intentos de handoff (ya no existe en el hilo listener).
    recovery-backoff: ${PEDIDOS360_RECOVERY_BACKOFF:500ms}
    max-pending-correlations: ${PEDIDOS360_MAX_PENDING:1024}
    max-body-bytes: ${PEDIDOS360_MAX_BODY_BYTES:262144}
    actor:
      # Tenant de Entra emisor del sobre. Sin valor, relay-mode ACTIVE no arranca.
      emisor: ${ENTRA_TENANT_ID:}
      # Clave de firma del contexto de actor: nunca un valor por defecto ni versionado en Git.
      clave-id: ${PEDIDOS360_ACTOR_KEY_ID:}
      secreto: ${PEDIDOS360_ACTOR_SECRET:}
      tolerancia-reloj: ${PEDIDOS360_ACTOR_CLOCK_SKEW:5s}
  bff:
    actor:
      emisor: ${ENTRA_TENANT_ID:}
      ttl: ${PEDIDOS360_ACTOR_TTL:4s}
      destinos: p360.usuarios.consultas.q,p360.restaurantes.consultas.q,p360.productos.consultas.q,p360.pagos.consultas.q
