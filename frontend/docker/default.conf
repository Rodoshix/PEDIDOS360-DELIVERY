server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Sin BFF/proxy: nunca responder HTML como si fuera una API.
    location = /api { return 404; }
    location ^~ /api/ { return 404; }
    location ~ /\. { return 404; }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # El router de React decide navegación/404 y exige sesión en rutas privadas.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
