services:
  frontend:
    build:
      context: ../../frontend
      args:
        VITE_API_BASE_URL: ${PUBLIC_API_BASE_URL:?Configura PUBLIC_API_BASE_URL}
        VITE_ENTRA_CLIENT_ID: ${ENTRA_FRONTEND_CLIENT_ID:?Configura ENTRA_FRONTEND_CLIENT_ID}
        VITE_ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:?Configura ENTRA_TENANT_ID}
        VITE_ENTRA_REDIRECT_URI: ${FRONTEND_ORIGIN:?Configura FRONTEND_ORIGIN}
        VITE_ENTRA_API_SCOPE: api://${ENTRA_API_CLIENT_ID:?Configura ENTRA_API_CLIENT_ID}/access_as_user
  bff:
    build:
      context: ../../backend/bff
  usuarios:
    build:
      context: ../../backend/services/usuarios-service
  restaurantes:
    build:
      context: ../../backend/services/restaurantes-service
  productos:
    build:
      context: ../../backend/services/productos-service
  carrito:
    build:
      context: ../../backend/services/carrito-service
  pedidos:
    build:
      context: ../../backend/services/pedidos-service
  pagos:
    build:
      context: ../../backend/services/pagos-service
