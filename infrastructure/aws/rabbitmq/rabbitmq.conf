# #69 topology is provisioned additively after read-only preflight, never boot-imported.
default_queue_type = quorum
listeners.tcp = none
listeners.ssl.default = 5671
ssl_options.cacertfile = /run/ep2/tls/ca.pem
ssl_options.certfile = /run/ep2/tls/server.pem
ssl_options.keyfile = /run/ep2/tls/server-key.pem
ssl_options.verify = verify_peer
# Existing password clients need server-auth TLS, not compulsory client certificates.
# If a client supplies a certificate, verify_peer validates it. Clients MUST verify CA + SAN.
ssl_options.fail_if_no_peer_cert = false
ssl_options.versions.1 = tlsv1.3
ssl_options.versions.2 = tlsv1.2
# HTTPS-only: omit management.tcp.* entirely; 'none' is invalid in 4.1.8.
management.ssl.port = 15671
management.ssl.cacertfile = /run/ep2/tls/ca.pem
management.ssl.certfile = /run/ep2/tls/server.pem
management.ssl.keyfile = /run/ep2/tls/server-key.pem
management.ssl.verify = verify_peer
management.ssl.fail_if_no_peer_cert = false
management.ssl.versions.1 = tlsv1.3
management.ssl.versions.2 = tlsv1.2
# 60% of provisional 768MiB, absolute to avoid host/cgroup detection ambiguity.
vm_memory_high_watermark.absolute = 460MiB
disk_free_limit.absolute = 2GiB
log.console = true
log.file = false
