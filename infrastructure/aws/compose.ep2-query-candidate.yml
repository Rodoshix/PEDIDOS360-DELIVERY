# Reviewed candidate, NOT loaded by current Compose or .env.
# Apply only in the approved window, with provisioned ES256 keys and TLS.
services:
  bff:
    environment:
      PEDIDOS360_RELAY_MODE: ACTIVE
      PEDIDOS360_IDENTITY_PROOF_ENABLED: "true"
      BFF_QUERY_USUARIOS_MODE: RABBITMQ
      BFF_QUERY_RESTAURANTES_MODE: RABBITMQ
      BFF_QUERY_PRODUCTOS_MODE: RABBITMQ
      BFF_QUERY_PAGOS_MODE: RABBITMQ
  usuarios:
    environment:
      PEDIDOS360_RELAY_MODE: ACTIVE
      PEDIDOS360_IDENTITY_PROOF_ENABLED: "true"
  restaurantes:
    environment:
      PEDIDOS360_RELAY_MODE: ACTIVE
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:?Configura ENTRA_TENANT_ID}
  productos:
    environment:
      PEDIDOS360_RELAY_MODE: ACTIVE
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:?Configura ENTRA_TENANT_ID}
  pagos:
    environment:
      PEDIDOS360_RELAY_MODE: ACTIVE
      PEDIDOS360_IDENTITY_PROOF_ENABLED: "true"
