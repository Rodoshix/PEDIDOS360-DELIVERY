name: pedidos360-stack-local

x-java: &java
  read_only: true
  tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 512m
  pids_limit: 256
  healthcheck:
    test: [CMD, java, -cp, /app, Health]
    interval: 10s
    timeout: 8s
    start_period: 90s
    retries: 12

x-java-env: &java-env
  SERVER_ADDRESS: 0.0.0.0
  SERVER_SSL_ENABLED: "true"
  SERVER_SSL_KEY_STORE: file:/run/tls/server.p12
  SERVER_SSL_KEY_STORE_TYPE: PKCS12
  SPRING_CONFIG_IMPORT: configtree:/run/secrets/
  JAVA_TOOL_OPTIONS: "-Djavax.net.ssl.trustStore=/run/tls/truststore.p12 -Djavax.net.ssl.trustStorePassword=changeit"
  MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: never
  LOCAL_IDENTITY_ENABLED: "false"

x-entra: &entra
  ENTRA_ENABLED: "true"
  ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:?Configura ENTRA_TENANT_ID}
  ENTRA_API_CLIENT_ID: ${ENTRA_API_CLIENT_ID:?Configura ENTRA_API_CLIENT_ID}
  ENTRA_FRONTEND_CLIENT_ID: ${ENTRA_FRONTEND_CLIENT_ID:?Configura ENTRA_FRONTEND_CLIENT_ID}

services:
  frontend:
    image: pedidos360-frontend:i5-stack
    build:
      context: ../../../frontend
      args:
        VITE_API_BASE_URL: http://localhost:${STACK_FRONTEND_PORT:-5180}/api
        VITE_ENTRA_CLIENT_ID: ${ENTRA_FRONTEND_CLIENT_ID:?Configura ENTRA_FRONTEND_CLIENT_ID}
        VITE_ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:?Configura ENTRA_TENANT_ID}
        VITE_ENTRA_REDIRECT_URI: http://localhost:${STACK_FRONTEND_PORT:-5180}
        VITE_ENTRA_API_SCOPE: api://${ENTRA_API_CLIENT_ID:?Configura ENTRA_API_CLIENT_ID}/access_as_user
    ports: ["127.0.0.1:${STACK_FRONTEND_PORT:-5180}:8080"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${STACK_TLS_DIR:-./tls}/bff.crt:/run/tls/bff.crt:ro
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    networks: [front]
    depends_on:
      bff: {condition: service_healthy}

  bff:
    <<: *java
    image: pedidos360-bff:i5-stack
    build: {context: ../../../backend/bff}
    environment:
      <<: [*java-env, *entra]
      SERVER_PORT: "8080"
      BFF_PEDIDOS_PAGOS_ENABLED: "true"
      BFF_CORS_ORIGINS: http://localhost:${STACK_FRONTEND_PORT:-5180}
      USUARIOS_SERVICE_URL: https://usuarios:8081
      RESTAURANTES_SERVICE_URL: https://restaurantes:8082
      PRODUCTOS_SERVICE_URL: https://productos:8083
      CARRITO_SERVICE_URL: https://carrito:8084
      PEDIDOS_SERVICE_URL: https://pedidos:8085
      PAGOS_SERVICE_URL: https://pagos:8086
    volumes:
      - ${STACK_TLS_DIR:-./tls}/bff.p12:/run/tls/server.p12:ro
      - ${STACK_TLS_DIR:-./tls}/truststore.p12:/run/tls/truststore.p12:ro
    secrets:
      - source: tls_password
        target: server.ssl.key-store-password
    networks: [front, services, entra-egress]
    depends_on:
      usuarios: {condition: service_healthy}
      restaurantes: {condition: service_healthy}
      productos: {condition: service_healthy}
      carrito: {condition: service_healthy}
      pedidos: {condition: service_healthy}
      pagos: {condition: service_healthy}

  usuarios:
    <<: *java
    image: pedidos360-usuarios:i5-stack
    build: {context: ../../../backend/services/usuarios-service}
    environment:
      <<: [*java-env, *entra]
      SERVER_PORT: "8081"
      DB_URL: jdbc:postgresql://usuarios-db:5432/pedidos360_usuarios
      DB_USERNAME: pedidos360_usuarios
    volumes:
      - ${STACK_TLS_DIR:-./tls}/usuarios.p12:/run/tls/server.p12:ro
      - ${STACK_TLS_DIR:-./tls}/truststore.p12:/run/tls/truststore.p12:ro
    secrets:
      - source: tls_password
        target: server.ssl.key-store-password
      - source: usuarios_db_password
        target: spring.datasource.password
    networks: [services, usuarios-data, entra-egress]
    depends_on:
      usuarios-db: {condition: service_healthy}

  usuarios-db:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: pedidos360_usuarios
      POSTGRES_USER: pedidos360_usuarios
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - source: usuarios_db_password
        target: db_password
    volumes: [usuarios_data:/var/lib/postgresql/data]
    networks: [usuarios-data]
    mem_limit: 256m
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 20

  restaurantes:
    <<: *java
    image: pedidos360-restaurantes:i5-stack
    build: {context: ../../../backend/services/restaurantes-service}
    environment:
      <<: *java-env
      SERVER_PORT: "8082"
      DB_URL: jdbc:postgresql://restaurantes-db:5432/pedidos360_restaurantes
      DB_USERNAME: pedidos360_restaurantes
    volumes:
      - ${STACK_TLS_DIR:-./tls}/restaurantes.p12:/run/tls/server.p12:ro
      - ${STACK_TLS_DIR:-./tls}/truststore.p12:/run/tls/truststore.p12:ro
    secrets:
      - source: tls_password
        target: server.ssl.key-store-password
      - source: restaurantes_db_password
        target: spring.datasource.password
    networks: [services, restaurantes-data]
    depends_on:
      restaurantes-db: {condition: service_healthy}

  restaurantes-db:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: pedidos360_restaurantes
      POSTGRES_USER: pedidos360_restaurantes
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - source: restaurantes_db_password
        target: db_password
    volumes: [restaurantes_data:/var/lib/postgresql/data]
    networks: [restaurantes-data]
    mem_limit: 256m
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 20

  productos:
    <<: *java
    image: pedidos360-productos:i5-stack
    build: {context: ../../../backend/services/productos-service}
    environment:
      <<: *java-env
      SERVER_PORT: "8083"
      DB_URL: jdbc:postgresql://productos-db:5432/pedidos360_productos
      DB_USERNAME: pedidos360_productos
    volumes:
      - ${STACK_TLS_DIR:-./tls}/productos.p12:/run/tls/server.p12:ro
      - ${STACK_TLS_DIR:-./tls}/truststore.p12:/run/tls/truststore.p12:ro
    secrets:
      - source: tls_password
        target: server.ssl.key-store-password
      - source: productos_db_password
        target: spring.datasource.password
    networks: [services, productos-data]
    depends_on:
      productos-db: {condition: service_healthy}

  productos-db:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: pedidos360_productos
      POSTGRES_USER: pedidos360_productos
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - source: productos_db_password
        target: db_password
    volumes: [productos_data:/var/lib/postgresql/data]
    networks: [productos-data]
    mem_limit: 256m
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 20

  carrito:
    <<: *java
    image: pedidos360-carrito:i5-stack
    build: {context: ../../../backend/services/carrito-service}
    environment:
      <<: [*java-env, *entra]
      SERVER_PORT: "8084"
      DB_URL: jdbc:postgresql://carrito-db:5432/pedidos360_carrito
      DB_USERNAME: pedidos360_carrito
      CATALOGO_HTTP_ENABLED: "true"
      PRODUCTOS_SERVICE_URL: https://productos:8083
    volumes:
      - ${STACK_TLS_DIR:-./tls}/carrito.p12:/run/tls/server.p12:ro
      - ${STACK_TLS_DIR:-./tls}/truststore.p12:/run/tls/truststore.p12:ro
    secrets:
      - source: tls_password
        target: server.ssl.key-store-password
      - source: carrito_db_password
        target: spring.datasource.password
    networks: [services, carrito-data, entra-egress]
    depends_on:
      carrito-db: {condition: service_healthy}
      productos: {condition: service_healthy}

  carrito-db:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: pedidos360_carrito
      POSTGRES_USER: pedidos360_carrito
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - source: carrito_db_password
        target: db_password
    volumes: [carrito_data:/var/lib/postgresql/data]
    networks: [carrito-data]
    mem_limit: 256m
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 20

  pedidos:
    <<: *java
    image: pedidos360-pedidos:i5-stack
    build: {context: ../../../backend/services/pedidos-service}
    environment:
      <<: [*java-env, *entra]
      SERVER_PORT: "8085"
      DB_URL: jdbc:postgresql://pedidos-db:5432/pedidos360_pedidos
      DB_USERNAME: pedidos360_pedidos
      PRODUCTOS_SERVICE_URL: https://productos:8083
      USUARIOS_SERVICE_URL: https://usuarios:8081
      INTERNO_ENABLED: "true"
      PAGOS_WORKER_CLIENT_ID: ${PAGOS_WORKER_CLIENT_ID:?Configura PAGOS_WORKER_CLIENT_ID}
    volumes:
      - ${STACK_TLS_DIR:-./tls}/pedidos.p12:/run/tls/server.p12:ro
      - ${STACK_TLS_DIR:-./tls}/truststore.p12:/run/tls/truststore.p12:ro
    secrets:
      - source: tls_password
        target: server.ssl.key-store-password
      - source: pedidos_db_password
        target: spring.datasource.password
    networks: [services, pedidos-data, entra-egress]
    depends_on:
      pedidos-db: {condition: service_healthy}
      productos: {condition: service_healthy}
      usuarios: {condition: service_healthy}

  pedidos-db:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: pedidos360_pedidos
      POSTGRES_USER: pedidos360_pedidos
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - source: pedidos_db_password
        target: db_password
    volumes: [pedidos_data:/var/lib/postgresql/data]
    networks: [pedidos-data]
    mem_limit: 256m
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 20

  pagos:
    <<: *java
    image: pedidos360-pagos:i5-stack
    build: {context: ../../../backend/services/pagos-service}
    environment:
      <<: [*java-env, *entra]
      SERVER_PORT: "8086"
      DB_URL: jdbc:postgresql://pagos-db:5432/pedidos360_pagos
      DB_USERNAME: pedidos360_pagos
      PEDIDOS_SERVICE_URL: https://pedidos:8085
      USUARIOS_SERVICE_URL: https://usuarios:8081
      PEDIDOS_INTERNO_ENABLED: "true"
      PAGOS_WORKER_ENABLED: "true"
      PAGOS_WORKER_CLIENT_ID: ${PAGOS_WORKER_CLIENT_ID:?Configura PAGOS_WORKER_CLIENT_ID}
    volumes:
      - ${STACK_TLS_DIR:-./tls}/pagos.p12:/run/tls/server.p12:ro
      - ${STACK_TLS_DIR:-./tls}/truststore.p12:/run/tls/truststore.p12:ro
    secrets:
      - source: tls_password
        target: server.ssl.key-store-password
      - source: pagos_db_password
        target: spring.datasource.password
      - source: worker_secret
        target: pagos.worker.client-secret
    networks: [services, pagos-data, entra-egress]
    depends_on:
      pagos-db: {condition: service_healthy}
      pedidos: {condition: service_healthy}
      usuarios: {condition: service_healthy}

  pagos-db:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: pedidos360_pagos
      POSTGRES_USER: pedidos360_pagos
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - source: pagos_db_password
        target: db_password
    volumes: [pagos_data:/var/lib/postgresql/data]
    networks: [pagos-data]
    mem_limit: 256m
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 20

volumes:
  usuarios_data:
  restaurantes_data:
  productos_data:
  carrito_data:
  pedidos_data:
  pagos_data:
networks:
  front:
  services: {internal: true}
  entra-egress:
  usuarios-data: {internal: true}
  restaurantes-data: {internal: true}
  productos-data: {internal: true}
  carrito-data: {internal: true}
  pedidos-data: {internal: true}
  pagos-data: {internal: true}

# Secretos en archivos locales ignorados; necesarios para contenedores read-only.
secrets:
  tls_password: {file: "${STACK_SECRETS_DIR:-./secrets}/tls_password"}
  worker_secret: {file: "${STACK_SECRETS_DIR:-./secrets}/worker_secret"}
  usuarios_db_password: {file: "${STACK_SECRETS_DIR:-./secrets}/usuarios_db_password"}
  restaurantes_db_password: {file: "${STACK_SECRETS_DIR:-./secrets}/restaurantes_db_password"}
  productos_db_password: {file: "${STACK_SECRETS_DIR:-./secrets}/productos_db_password"}
  carrito_db_password: {file: "${STACK_SECRETS_DIR:-./secrets}/carrito_db_password"}
  pedidos_db_password: {file: "${STACK_SECRETS_DIR:-./secrets}/pedidos_db_password"}
  pagos_db_password: {file: "${STACK_SECRETS_DIR:-./secrets}/pagos_db_password"}
