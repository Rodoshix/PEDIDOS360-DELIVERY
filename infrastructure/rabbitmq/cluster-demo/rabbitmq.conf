# Synthetic local demonstration only; not an AWS configuration.
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbit-demo-1
# One seed: node 1 bootstraps, node 2 joins it. Avoid waiting for a not-yet-started peer.
cluster_partition_handling = pause_minority
default_queue_type = quorum
listeners.tcp = none
listeners.ssl.default = 5671
ssl_options.cacertfile = /etc/rabbitmq/demo-tls/ca.pem
ssl_options.certfile = /etc/rabbitmq/demo-tls/server.pem
ssl_options.keyfile = /etc/rabbitmq/demo-tls/server-key.pem
ssl_options.verify = verify_peer
ssl_options.fail_if_no_peer_cert = false
ssl_options.versions.1 = tlsv1.3
ssl_options.versions.2 = tlsv1.2
management.ssl.port = 15671
management.ssl.cacertfile = /etc/rabbitmq/demo-tls/ca.pem
management.ssl.certfile = /etc/rabbitmq/demo-tls/server.pem
management.ssl.keyfile = /etc/rabbitmq/demo-tls/server-key.pem
management.ssl.verify = verify_peer
management.ssl.fail_if_no_peer_cert = false
vm_memory_high_watermark.absolute = 460MiB
disk_free_limit.absolute = 2GiB
log.console = true
log.file = false
